[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "two-layer-ctmc"
version = "1.1"
description = "Gillespie and TwoScale SIR/SIS simulation on community networks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = ["numpy>=1.21", "networkx>=2.8"]

[project.scripts]
two-layer-ctmc = "two_layer_ctmc.__main__:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["two_layer_ctmc*"]
namespaces = false
